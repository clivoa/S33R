name: Update news_recent.json

permissions:
  contents: write

concurrency:
  group: update-news-recent-json
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 * * * *"  # every hour
  workflow_dispatch:

jobs:
  build-news-json:
    runs-on: ubuntu-latest
    env:
      NEWS_RECENT_MAX_BYTES: "95000000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser

      - name: Sync active feed catalog
        run: |
          python scripts/sync_feed_catalog.py

      - name: Build news_recent.json
        run: |
          python scripts/build_news_json.py

      - name: Commit and push changes
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A sec_feeds.xml data
          git diff --cached --quiet && { echo "No changes detected."; exit 0; }
          git commit -m "Update generated feed data"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push failed on attempt ${attempt}; rebasing on latest main before retry."
            git pull --rebase origin main
            sleep 10
          done

          echo "::error::Failed to push generated feed data after 3 attempts."
          exit 1
