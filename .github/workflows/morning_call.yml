name: Build SOC Morning Call

on:
  schedule:
    # Adjust the schedule as desired (UTC):
    # Example: every day at 06:15 UTC
    - cron: "15 6 * * *"
  workflow_dispatch: {}

jobs:
  morning-call:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      TARGET_BRANCH: main

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # If you already use requirements.txt for the project, use it:
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            # Minimal fallback if requirements.txt does not exist yet.
            pip install openai feedparser
          fi

      - name: Build SOC morning call JSON
        env:
          # Supported: openai (default), anthropic/claude, gemini/google.
          MORNING_CALL_PROVIDER: "openai"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Analysis window (last N hours).
          MORNING_CALL_WINDOW_HOURS: "24"
          # Maximum items passed to the model.
          MORNING_CALL_MAX_ITEMS: "100"
          # Token limit for the response.
          MORNING_CALL_MAX_OUTPUT_TOKENS: "3000"
          # Optional. If omitted, build_morning_call.py uses a provider-specific default model.
          # MORNING_CALL_MODEL: "gpt-5.2"
          # Paths expected by the script.
          NEWS_JSON_PATH: "data/news_recent.json"
          MORNING_CALL_OUTPUT_DIR: "data/archive"
        run: |
          python scripts/build_morning_call.py

      - name: Build morning call index JSON
        run: |
          python scripts/build_morning_call_index.py

      - name: Commit changes via GitHub API (branch main)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="main"
          
          CHANGED=$(git ls-files -m -o --exclude-standard data/** || true)
          [ -z "$CHANGED" ] && { echo "No changes detected."; exit 0; }
 
          for file in $CHANGED; do
            echo "Processing $file"
 
            # Content encoded WITHOUT line breaks.
            BASE64_CONTENT="$(base64 -w 0 "$file" | tr -d '\n')"
 
            # Current SHA (if any).
            SHA=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
                     "https://api.github.com/repos/${{ github.repository }}/contents/$file?ref=$BRANCH" \
                     | jq -r .sha)
 
            if [ "${SHA:-null}" = "null" ] || [ -z "$SHA" ]; then
              # ---------- NEW FILE ----------
              printf '%s\n' "$BASE64_CONTENT" \
                | jq -Rs --arg msg "Add $file" --arg branch "$BRANCH" \
                    '{message:$msg, content:., branch:$branch}' \
                | curl -sS -X PUT -H "Authorization: token $GITHUB_TOKEN" \
                        -H "Content-Type: application/json" \
                        --data-binary @- \
                        "https://api.github.com/repos/${{ github.repository }}/contents/$file"
            else
              # ---------- UPDATE EXISTING ----------
              printf '%s\n' "$BASE64_CONTENT" \
                | jq -Rs --arg msg "Update $file" --arg branch "$BRANCH" --arg sha "$SHA" \
                    '{message:$msg, content:., branch:$branch, sha:$sha}' \
                | curl -sS -X PUT -H "Authorization: token $GITHUB_TOKEN" \
                        -H "Content-Type: application/json" \
                        --data-binary @- \
                        "https://api.github.com/repos/${{ github.repository }}/contents/$file"
            fi
          done
